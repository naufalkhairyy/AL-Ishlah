$kind: http-request
url: "{{base_url}}/auth-user"
method: GET
headers:
  Accept: application/json
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('token', pm.collectionVariables.get('santri_token'));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Santri token is active', function () {
        pm.response.to.have.status(200);
        const json = pm.response.json();
        pm.expect(json.status).to.eql(true);
        pm.expect(json.data.role).to.eql('calon_santri');
      });
    language: text/javascript
order: 14000
