$kind: http-request
url: "{{base_url}}/pembayaran/{{pembayaran_id}}"
method: DELETE
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Pembayaran cleanup completed', function () {
        pm.expect([200, 404]).to.include(pm.response.code);
      });
      pm.collectionVariables.unset('pembayaran_id');
    language: text/javascript
order: 24000
